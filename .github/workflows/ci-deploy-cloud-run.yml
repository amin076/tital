name: Tital CI and Cloud Run Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tital-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

  deploy:
    name: Deploy to Cloud Run
    needs: validate
    if: >-
      vars.GCP_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      TITAL_FIREBASE_API_KEY: ${{ secrets.TITAL_FIREBASE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GCP_WIF_PROVIDER" || { echo "::error::Missing GitHub Actions secret GCP_WIF_PROVIDER"; exit 1; }
          test -n "$GCP_DEPLOY_SERVICE_ACCOUNT" || { echo "::error::Missing GitHub Actions secret GCP_DEPLOY_SERVICE_ACCOUNT"; exit 1; }
          test -n "$TITAL_FIREBASE_API_KEY" || { echo "::error::Missing GitHub Actions secret TITAL_FIREBASE_API_KEY"; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: scientific-film-director-agent
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy Tital from source
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: tital
          project_id: scientific-film-director-agent
          region: australia-southeast1
          source: .
          env_vars_update_strategy: merge
          env_vars: |-
            GOOGLE_CLOUD_PROJECT=scientific-film-director-agent
            GOOGLE_CLOUD_LOCATION=global
            GOOGLE_GENAI_USE_VERTEXAI=true
            TITAL_GCS_BUCKET=tital-sessions-593835701785
            TITAL_GCS_PREFIX=sessions
            TITAL_AUTH_REQUIRED=true
            TITAL_FIREBASE_PROJECT_ID=scientific-film-director-agent
            TITAL_FIREBASE_AUTH_DOMAIN=scientific-film-director-agent.firebaseapp.com
            TITAL_FIREBASE_API_KEY=${{ env.TITAL_FIREBASE_API_KEY }}
            TITAL_DEMO_SESSION_ID=${{ vars.TITAL_DEMO_SESSION_ID }}
            TITAL_RELEASE_SHA=${{ github.sha }}
          timeout: 900s
          flags: >-
            --service-account=tital-runtime@scientific-film-director-agent.iam.gserviceaccount.com
            --max-instances=1
            --concurrency=1
            --memory=1Gi

      - name: Verify deployed runtime
        env:
          TITAL_SERVICE_URL: ${{ steps.deploy.outputs.url }}
          TITAL_EXPECTED_RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          health_url="${TITAL_SERVICE_URL%/}/api/health"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 \
            --output /tmp/tital-health.json "$health_url"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const expected = process.env.TITAL_EXPECTED_RELEASE_SHA;
            const health = JSON.parse(readFileSync("/tmp/tital-health.json", "utf8"));
            if (health.status !== "ok") throw new Error("Cloud Run health is not ok.");
            if (health.runtime?.model !== "gemini-3.5-flash") throw new Error("Unexpected deployed Gemini model.");
            if (health.runtime?.agentFramework !== "Google ADK") throw new Error("Google ADK runtime proof is missing.");
            if (health.runtime?.infrastructure !== "Cloud Run") throw new Error("Cloud Run runtime proof is missing.");
            if (health.runtime?.releaseSha !== expected) throw new Error("Deployed release SHA does not match this workflow commit.");
          '

      - name: Deployment summary
        run: |
          echo "### Tital Cloud Run deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Service URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
